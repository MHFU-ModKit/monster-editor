# MOVES — the ALIGNMENT: which host behaviour pair runs, and which of the port's own
# clips is painted on it while it does. The pairs are the HOST's (em75 = Tigrex); a
# ported monster has no AI of its own.

[moves.lunge]
main = 1
sub = 4
clip = "lunge_forward"
latch = 1                    # (1,4) names a single a1, so one dispatch covers the move
# The chain. The engine's own way out of (1,4) is its run budget (+0x76C), which its
# translator sets and a Lua act_set does not — forced, the charge stood 38 s with its
# hitbox spent. `after` is where the runtime hands the charge when it is over or has
# stood `hold_max` ticks (2 Hz). The engine itself goes to (0,3), the skid; that pair
# names no clip, so the port's stop rides (1,3) instead — see lunge_stop.
after = "lunge_stop"
hold_max = 8

[moves.lunge_stop]
main = 1
sub = 3
clip = "stop_walk_forward"
latch = 1
label = "the charge's own stop/recover (1,3) — its a1 is 2, which on this PAC is the howl; declared so the skid gets a stop clip instead"

# ⚠️ THE IMPACT IS 22 FRAMES LATE, AND THAT IS ACCEPTED, NOT MISSED.
# The handler tests frames 0 and 40; lunge_forward's contact is at frame 62, so the
# damage lands roughly a third of a second before the horns visibly connect. Fixing it
# means retiming the clip on a rebuild. Judged on screen first.
#
# 🔴 THE HOST'S ANIMATION IS EVIDENCE ABOUT THE HOST'S PHYSICS, and that is why this
# pair and not a better-timed one. (1,4) plays a1=17: 1823 units forward, ~0 vertical —
# a pure ground charge, the right physics for a lunge. (2,0) tests frame 60 (a 2-frame
# miss, numerically perfect) but its a1=18 goes 63 units forward and 663 straight UP:
# it is a jump-and-hover, and a ground lunge painted on it would slide forward while
# the engine thinks the animal is airborne. Judged in the editor's host reference.
#
# ⚠️ (1,4), (1,5) and (1,9) are the SAME FUNCTION — handler 0x09D28738. Aliases; there
# is nothing to choose between them.
# ⚠️ This family's a1=17 is `a1_computed: true` — recovered from a register or table
# rather than read as a literal, so it is the softer half of the intel. `ends_on` is
# `cursor`, so the clip's length does not end the action; the handler does. Both are
# cold-boot questions, not static ones.
# ⚠️ No census covers (1,4): `entered` is UNKNOWN, not zero.

